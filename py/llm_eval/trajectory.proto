syntax = "proto3";

package llm_eval;

// One frozen-model solve attempt: a header, then one Step per macro. On disk the
// messages are length-delimited (a uint32 little-endian size prefix each),
// matching the .rollout framing. Frames are embedded PNG bytes, so a trajectory
// is a single self-contained file.

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message TokenUsage {
  int32 input = 1;
  int32 output = 2;
  int32 cached = 3;
  int32 image = 4;     // share of input
  int32 thinking = 5;  // share of output
}

// The percept the model re-answers across retries. Stored once per Step.
message Observation {
  bytes frame_png = 1;     // annotated frame, PNG-encoded (empty if uncaptured)
  string percept_json = 2;  // the marked-entity list the agent saw
  Vec3 player = 3;
  float eye_yaw = 4;        // camera yaw, for a map facing arrow
  int32 held_mark = 5;
}

// One LLM round-trip against the Step's observation -- same shape whether the
// validator accepted or rejected it.
message Call {
  string prompt_sent = 1;       // the exact message sent this call (percept, or a re-prompt)
  string thinking = 2;          // this call's thought-summary text
  string raw_response = 3;      // the model's full reply, verbatim
  string reasoning = 4;         // parsed reasoning ("" if the reply didn't parse)
  TokenUsage usage = 5;
  bool accepted = 6;            // the validator passed this call (at most one per Step)
  string rejection_reason = 7;  // "" if accepted, else "invalid JSON" or the validate() reason
  // action/result are opaque serialized harness protos -- set only on the
  // accepted call; parse them with harness_pb2.
  bytes action = 8;             // serialized harness.MacroRequest
  bytes result = 9;             // serialized harness.MacroResult
}

message TrajectoryHeader {
  string map = 1;
  reserved 2, 3;  // was exit_pos/success_radius; the engine auto-detects the exit
  reserved "exit_pos", "success_radius";
  string model = 4;          // empty for the scripted agent
  string system_prompt = 5;  // empty for the scripted agent
  string grammar = 6;        // the verb vocabulary in play, for provenance
}

message Step {
  int32 index = 1;
  Observation obs = 2;
  repeated Call calls = 3;  // try 0..N in order; the last is accepted, or none is (gave up)
  string terminal = 4;      // empty except the final step: SOLVED|DONE|BUDGET|GAVE_UP
}
