[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv]
environments = ["sys_platform == 'linux'"]
# grpcio-tools is pulled in by flax → orbax-checkpoint, but no version
# supports protobuf>=7. It's only needed for proto compilation (not runtime),
# so we effectively exclude it with an impossible marker.
override-dependencies = ["grpcio-tools; python_version < '3'"]

[tool.ruff]
# Select rules for Google-style docstrings and import sorting
# D: pydocstyle (standard docstring checks)
# I: isort (import sorting)
select = ["E", "F", "D", "I"]

[tool.ruff.lint.pydocstyle]
# Explicitly use Google style for docstrings
convention = "google"

[tool.ruff.format]
# Google style often favors single quotes for strings
quote-style = "single"
# Standard indentation (4 spaces) is used, but you can adjust if needed
indent-style = "space"

[tool.ruff.lint.isort]
# Google style: one import per line is often preferred for modules
force-single-line = true

[project]
name = "sourceautorecord"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.80.0",
    "opencv-python>=4.13.0.92",
    "protobuf>=7.34.1",
    "gymnasium>=0.29.1",
    "absl-py>=2.0.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ray[rllib]>=2.55.1",
    "gputil>=1.4.0",
    "jax[cuda13]>=0.6.0",
    "flax>=0.10.0",
    "optax>=0.2.4",
    "msgpack>=1.0.0",
    "tensorboardX>=2.6.0",
    "coolname>=5.0.0",
    "nicegui>=2.0.0",
    "pillow>=10.0.0",
    "fastapi>=0.136.3",
    "python-dotenv>=1.2.2",
    "google-genai>=2.8.0",
    "markdown-it-py>=4.0.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.20.0",
    "srctools>=2.7.0",
]
