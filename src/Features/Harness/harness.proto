syntax = "proto3";

package portal2_harness;

// The core service for external game control
// docs/harness.proto:Portal2Harness>
service Portal2Harness {
  // Handshake to verify connection and sync game constants
  rpc InitialHandshake(HandshakeRequest) returns (HandshakeResponse);

  // Get the current state of the player and world
  rpc Observe(Empty) returns (GameState);

  // Send an action to be executed in the next game tick
  rpc Act(ActionRequest) returns (ActionResponse);

  // Execute an arbitrary console command (DANGEROUS - testing only)
  rpc ExecuteCommand(CommandRequest) returns (CommandResponse);

  // Reset the episode: restart level, wait for warmup, return initial state
  rpc Reset(ResetRequest) returns (ResetResponse);

  // Bidirectional stream for high-performance agent loop
  rpc AgentLoop(stream AgentMessage) returns (stream EnvironmentMessage);

  // First-class endpoint to render a demo file end-to-end.
  // Initiates playback and blocks internally until rollout conversion
  // concludes.
  rpc RenderDemo(RenderDemoRequest) returns (RenderDemoResponse);
}

// --- Shared Types ---

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// --- Streaming Messages ---

message AgentMessage {
  ActionRequest action = 1;
  // When true, copies the current framebuffer into POSIX shared memory
  // (set up during InitialHandshake). This is expensive (~1ms+) as it
  // dispatches ReadScreenPixels to the engine's main thread.
  // Agents that only need game state (position, velocity, etc.) should
  // leave this false. For visual RL, consider requesting pixels every
  // N ticks (e.g. every 4-10 ticks) rather than every tick.
  bool copy_pixels_to_shm = 2;

  // One closed semantic verb (defined below). When present (has_macro()),
  // the server runs the macro executor instead of the raw `action` framebulk
  // path -- no oneof, so the existing `action` path is untouched.
  MacroRequest macro = 3;
}

message EnvironmentMessage {
  GameState state = 1;
  bool success = 2;
  string error_message = 3;

  // Set only on macro steps: the structured outcome of the verb. The refreshed
  // percept rides on `state` above (AgentLoop already calls Observe).
  MacroResult macro_result = 4;
}

// --- Macro Messages ---
// Closed semantic verbs for the LLM percept/act harness. One verb per step.
// See brainstorm/macro_executor_impl_plan.md and llm_percept_act_grammar.md.

message MacroRequest {
  string verb =
      1;  // aim_at|look|go_to|move|pick_up_cube|release_cube|press|interact|wait|done
  int32 mark = 2;   // anchored verbs: target mark (0 = unset)
  int32 ticks = 3;  // wait() AND move(): hold duration in ticks
  string dir = 4;   // move(): forward|back|left|right (relative to facing)
  int32 yaw = 5;    // look(): signed degrees, lexer-snapped to 15
  int32 pitch =
      6;  // look(): signed degrees, lexer-snapped to 15, engine-clamped
  // P1 (portals/nav): string color; Vector3 point; string direction;
}

message MacroResult {
  bool ok = 1;
  string result_code =
      2;  // SUCCESS|STUCK|BLOCKED|UNREACHABLE|BAD_MARK|EDGE|WALL|COMPLETED|NOT_IMPLEMENTED|...
  string detail = 3;
  bool reached = 4;      // go_to
  float final_dist = 5;  // go_to
  float moved_dist =
      6;  // move (so the model calibrates ticks->distance from feedback)
}

message EntityField {
  string name = 1;
  oneof value {
    float float_val = 2;
    int32 int_val = 3;
    Vector3 vec3_val = 4;
    bool bool_val = 5;
    string string_val = 6;
    int32 handle_val = 7;
  }
}

message EntityState {
  int32 entity_index = 1;
  int32 serial_number = 2;
  string class_name = 3;
  string target_name = 4;
  Vector3 position = 5;
  Vector3 angles = 6;
  Vector3 velocity = 7;
  repeated EntityField fields = 8;
  bool deleted = 9;
  int32 mark =
      10;  // canonical MarkTable mark (0 = unmarked); frame<->telemetry bridge
}

message EntitySnapshot {
  repeated EntityState entities = 1;
  bool is_full_snapshot = 2;
  int32 tick = 3;
}

message GameState {
  Vector3 position = 1;
  Vector3 velocity = 2;
  Vector3 camera = 3;  // Pitch, Yaw, Roll
  int32 health = 4;    // 0 if dead
  bool is_crouching = 5;
  int32 server_tick = 6;
  EntitySnapshot entity_snapshot = 7;
}

// --- Action Messages ---

message ActionRequest {
  // Number of ticks to execute this action
  int32 num_ticks = 1;

  // Movement keys
  bool key_forward = 2;   // w
  bool key_left = 3;      // a
  bool key_backward = 4;  // s
  bool key_right = 5;     // d

  // Interaction/Ability keys
  bool key_use = 6;            // e
  bool key_zoomin = 7;         // z / mouse scroll up
  bool key_zoomout = 8;        // x / mouse scroll down
  bool key_crouch = 9;         // c
  bool portal_primary = 10;    // mouse left
  bool portal_secondary = 11;  // mouse right
  bool key_jump = 12;          // space

  // Mouse movement (analog value between [-1,+1])
  float mouse_dx = 13;
  float mouse_dy = 14;
}

message ActionResponse {
  bool success = 1;
  string error_message = 2;
}

// --- Command Messages ---

message CommandRequest {
  string command = 1;
}

message CommandResponse {
  bool success = 1;
  string error_message = 2;
}

// --- Reset Messages ---

message ResetRequest {
  string map_name = 1;  // optional: if empty, restart current map
}

message ResetResponse {
  bool success = 1;
  string error_message = 2;
  GameState initial_state = 3;  // first observation after reset
}

// --- Handshake Messages ---

message HandshakeRequest {
  string client_version = 1;
  string client_id = 2;
}

message HandshakeResponse {
  string game_version = 1;
  string map_name = 2;  // null if no map is loaded
  int32 shm_width = 3;  // Resolution for the shared memory buffer
  int32 shm_height = 4;
  int32 shm_size = 5;   // Total bytes allocated
  string shm_name = 6;  // POSIX SHM name (without leading /), set by server
}

// --- Rollout Recorder Messages ---

message RolloutHeader {
  string map_name = 1;
  int32 shm_width = 2;
  int32 shm_height = 3;
  float tickrate = 4;
  string shm_name = 5;  // not always needed tbh
}

message RolloutStep {
  GameState state = 1;
  ActionRequest action = 2;
  bytes image_data = 3;
}

message Empty {}

// --- Render Demo Messages ---

message RenderDemoRequest {
  string demo_path = 1;
  string output_path = 2;
  bool capture_pixels = 3;
}

message RenderDemoResponse {
  bool success = 1;
  string error_message = 2;
  string final_output_path = 3;
  int32 recorded_ticks = 4;
  int64 total_bytes = 5;
}
