syntax = "proto3";

package portal2_harness;

// The core service for external game control
service Portal2Harness {
  
  // Handshake to verify connection and sync game constants
  rpc InitialHandshake(HandshakeRequest) returns (HandshakeResponse);

  // Get the current state of the player and world
  rpc Observe(Empty) returns (GameState);

  // Send an action to be executed in the next game tick
  rpc Act(ActionRequest) returns (ActionResponse);

  // Execute an arbitrary console command (DANGEROUS - testing only)
  rpc ExecuteCommand(CommandRequest) returns (CommandResponse);

  // Reset the episode: restart level, wait for warmup, return initial state
  rpc Reset(ResetRequest) returns (ResetResponse);
}

// --- Shared Types ---

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// --- Observation Messages ---

message GameState {
  Vector3 position = 1;
  Vector3 velocity = 2;
  Vector3 camera = 3; // Pitch, Yaw, Roll
  int32 health = 4; // 0 if dead
  bool is_crouching = 5;
  int32 server_tick = 6; 
}

// --- Action Messages ---

message ActionRequest {
  // Number of ticks to execute this action
  int32 num_ticks = 1;
  
  // Movement keys
  bool key_forward = 2;  // w
  bool key_left = 3;     // a
  bool key_backward = 4; // s
  bool key_right = 5;    // d
  
  // Interaction/Ability keys
  bool key_use = 6;      // e
  bool key_zoomin = 7;   // z / mouse scroll up
  bool key_zoomout = 8;  // x / mouse scroll down
  bool key_crouch = 9;   // c
  bool portal_primary = 10;        // mouse left
  bool portal_secondary = 11;     // mouse right
  bool key_jump = 12;    // space

  // Mouse movement (analog value between [-1,+1]) 
  float mouse_dx = 13;
  float mouse_dy = 14;
}

message ActionResponse {
  bool success = 1;
  string error_message = 2;
}

// --- Command Messages ---

message CommandRequest {
  string command = 1;
}

message CommandResponse {
  bool success = 1;
  string error_message = 2;
}

// --- Reset Messages ---

message ResetRequest {
  string map_name = 1;  // optional: if empty, restart current map
}

message ResetResponse {
  bool success = 1;
  string error_message = 2;
  GameState initial_state = 3;  // first observation after reset
}

// --- Handshake Messages ---

message HandshakeRequest {
  string client_version = 1;
  string client_id = 2;
}

message HandshakeResponse {
  string game_version = 1;
  string map_name = 2; // null if no map is loaded
}

message Empty {}
